name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/data-pipeline
      - cleanup-rag-project

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: find api frontend scripts src -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Check shell scripts
        run: bash -n scripts/run_rag_evaluation.sh
